
shortname: "CreateMessageSimple"
id: "createmessagesimple"
description: "Data for creating a simple message"
imports: 
    - from: "Embed.dmodel"
      to: "Embed"
fields: 
    content:
        type:
            type: "scalar"
            name: "string"
            optional: true
        shortname: "Content"
        description: "The content of the message"
    embeds:
        type:
            type: "array"
            elementType:
                type: "scalar"
                name: "Embed"
            optional: true
        shortname: "Embeds"
        description: "The embeds of the message"